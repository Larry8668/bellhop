server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    server_tokens off;

    # Compose DNS. A variable in proxy_pass is resolved at request time so a
    # restarted server container does not leave nginx stuck on the old IP.
    resolver 127.0.0.11 valid=10s ipv6=off;

    location /api/ {
        include /etc/nginx/proxy-bellhop.conf;
    }

    location /mcp {
        include /etc/nginx/proxy-bellhop.conf;
    }

    # Vite production base is relative (`./`, for Capacitor). A trailing-slash
    # route would request /profile/assets/*; serve those from /assets/.
    location ~ ^/.+/assets/(.*)$ {
        try_files /assets/$1 =404;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
