# Bellhop local stack. Ollama stays on the host (http://host.docker.internal:11434).
# The browser talks only to `web`; nginx proxies /api and /mcp to `server`.

services:
  provider:
    build:
      context: .
      target: provider
    environment:
      PORT: "4010"
      DB_PATH: /data/provider.db
      PROVIDER_ADMIN: "1"
      BOOK_SUCCESS_P: ${BOOK_SUCCESS_P:-0.7}
      BOOK_SLOT_TAKEN_P: ${BOOK_SLOT_TAKEN_P:-0.15}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - provider-data:/data
    ports:
      - "4010:4010"
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:4010/health').then((r)=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 20s

  server:
    build:
      context: .
      target: server
    environment:
      SERVER_PORT: "4000"
      DB_PATH: /data/bellhop.db
      TRACES_DIR: /traces
      PROVIDER_URL: http://provider:4010
      OLLAMA_BASE_URL: http://host.docker.internal:11434
      MODEL_PROVIDER: ${MODEL_PROVIDER:-ollama}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET:-dev-secret-change-me}
      BETTER_AUTH_URL: ${BETTER_AUTH_URL:-http://localhost:8080}
      WEB_ORIGIN: ${WEB_ORIGIN:-http://localhost:8080}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - server-data:/data
      - traces:/traces
    ports:
      - "4000:4000"
    depends_on:
      provider:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:4000/api/health').then((r)=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 40s

  web:
    build:
      context: .
      target: web
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "8080:80"
    depends_on:
      server:
        condition: service_healthy

volumes:
  provider-data:
  server-data:
  traces:
